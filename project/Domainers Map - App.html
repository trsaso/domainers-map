<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domainers Map — Explorer prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#1b1917;--surface:#242120;--surface2:#2d2b2b;--text:#efe9e1;--muted:rgba(239,233,225,.62);--faint:rgba(239,233,225,.4);
  --divider:rgba(239,233,225,.14);--accent:#c28d41;--accent-hi:#e1ad66;--accent-deep:#7d5411;
  --heading:"Cormorant Garamond",Georgia,serif;--body:"Lora",Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:4px;--r-lg:7px;--shadow:0 12px 32px rgba(0,0,0,.45),0 0 0 1px rgba(239,233,225,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--body);overflow:hidden;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
.rail{grid-row:1/3;display:flex;flex-direction:column;border-right:1px solid var(--divider);padding:14px 10px 12px;gap:2px;min-height:0;background:var(--bg);overflow-y:auto}
.rail .me-card,.rail .cta{flex:none}
.rail .brand{padding:2px 10px 16px}
.rail button.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--muted);font-size:14px;text-align:left;width:100%}
.rail button.nv:hover{color:var(--text);background:rgba(239,233,225,.05)}
.rail button.nv[aria-current]{color:var(--accent);background:rgba(194,141,65,.08);box-shadow:inset 2px 0 0 var(--accent)}
.rail button.nv .ic{width:14px;height:14px;border:1.5px solid currentColor;border-radius:50%;flex:none;opacity:.8}
.rail button.nv .ic.sq{border-radius:2px}.rail button.nv .ic.dm{transform:rotate(45deg);border-radius:1px}.rail button.nv .ic.ln{border-radius:0;border-width:0 0 1.5px 0;height:7px}.rail button.nv .ic.pt{border-style:dashed}
.rail button.nv .count{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:rgba(194,141,65,.18);color:var(--accent-hi);font-variant-numeric:tabular-nums}
.rail .sep{height:1px;background:var(--divider);margin:8px 0}
.rail .cta{margin-top:auto;margin-bottom:10px}
.views{display:flex;flex-direction:column;min-height:0;min-width:0}
.views .view{flex:1}
a{color:var(--accent);text-underline-offset:3px}a:hover{color:var(--accent-hi)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid transparent;border-radius:var(--r)}
:focus{outline:none}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(194,141,65,.35)}
h1,h2,h3{font-family:var(--heading);font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.tag{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid var(--divider);color:var(--muted);white-space:nowrap}
.tag.accent{border-color:var(--accent);color:var(--accent)}
.tag.fill{background:rgba(194,141,65,.14);border-color:transparent;color:var(--accent-hi)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--divider);border-radius:var(--r);font-family:var(--heading);font-weight:600;font-size:14px;line-height:1.2;color:var(--text);transition:background .15s,border-color .15s}
.btn:hover{background:rgba(239,233,225,.06)}.btn:active{background:rgba(239,233,225,.12)}
.btn.primary{color:var(--accent);border-color:var(--accent)}.btn.primary:hover{background:rgba(194,141,65,.12)}.btn.primary:active{background:rgba(194,141,65,.22)}
.btn.ghost{border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hr{height:1px;background:var(--divider);border:0;margin:0}

/* top bar */
.top{height:56px;flex:none;display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1px solid var(--divider);background:var(--bg);z-index:900}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--heading);font-size:20px;font-weight:600;white-space:nowrap}
.brand i{width:10px;height:10px;border:1.5px solid var(--accent);border-radius:50%;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:2px;background:var(--accent);border-radius:50%}
.navtabs{display:flex;gap:2px}
.navtabs button{padding:6px 12px;border-radius:var(--r);color:var(--muted);font-size:14px}
.navtabs button:hover{color:var(--text);background:rgba(239,233,225,.05)}
.navtabs button[aria-current]{color:var(--accent);box-shadow:inset 0 -1px 0 var(--accent);border-radius:0}
.navtabs .count{font-size:10px;margin-left:5px;padding:1px 6px;border-radius:9px;background:rgba(194,141,65,.18);color:var(--accent-hi);font-variant-numeric:tabular-nums}
.proto{margin-left:auto;display:flex;gap:16px;align-items:center}
.proto label{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--divider);border-radius:var(--r);overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--muted);border-radius:0;border:0}
.seg button+button{border-left:1px solid var(--divider)}
.seg button:hover{background:rgba(239,233,225,.06);color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--heading);font-size:13px;color:var(--accent)}

/* views */
.view{flex:1;min-height:0;display:none}.view.on{display:flex}
#explore{position:relative}
aside#side{width:360px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--divider);background:var(--bg);transition:width .25s}
.side-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--divider)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:36px;padding:0 10px 0 32px;background:transparent;border:1px solid var(--divider);border-radius:var(--r);caret-color:var(--accent)}
.search input:hover{border-color:rgba(239,233,225,.4)}.search input:focus-visible{border-color:var(--accent);outline:none}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;padding:3px 10px;font-size:12px;border:1px solid var(--divider);border-radius:3px;color:var(--muted);transition:all .12s}
.chip:hover{color:var(--text);border-color:rgba(239,233,225,.35)}
.chip[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:rgba(194,141,65,.08)}
.chip.tld{font-family:var(--mono);font-size:11px}
.chiprow{display:flex;align-items:center;gap:8px}
.chiprow .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);width:48px;flex:none}
.results-bar{display:flex;align-items:baseline;justify-content:space-between;padding:10px 16px 6px;font-size:12px;color:var(--muted)}
.results-bar select{background:transparent;border:0;color:var(--muted);font-size:12px;padding:0}
#results{flex:1;overflow:auto;padding:0 10px 16px;display:flex;flex-direction:column;gap:6px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--divider);border-radius:var(--r);text-align:left;transition:border-color .15s,background .15s;position:relative}
.rcard:hover{border-color:rgba(239,233,225,.35);background:rgba(239,233,225,.03)}
.rcard[aria-selected="true"]{border-color:var(--accent);background:rgba(194,141,65,.07)}
.rcard .k{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rcard .k b{color:var(--accent);font-weight:400}
.rcard .t{font-family:var(--heading);font-size:18px;font-weight:600;line-height:1.15}
.rcard .t.mono{font-family:var(--mono);font-size:14px;font-weight:400;align-self:center}
.rcard .p{font-family:var(--mono);font-size:13px;color:var(--text);align-self:end;text-align:right}
.rcard .m{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.spons{font-size:9px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent);padding:0 5px;border-radius:2px}
.layout-split #results{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start}

#mapwrap{flex:1;min-width:0;position:relative;display:grid;grid-template-columns:1fr 0;transition:grid-template-columns .25s}
#map{grid-column:1;height:100%;background:#15130f;min-height:0}
.leaflet-overlay-pane svg path{vector-effect:non-scaling-stroke}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.68) contrast(.9) saturate(.3) sepia(.28)}
.leaflet-container{font:inherit;background:#15130f}
.leaflet-control-attribution{background:rgba(27,25,23,.8)!important;color:var(--faint)!important;font-size:10px;font-family:var(--body)}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar{border:1px solid var(--divider)!important;box-shadow:none!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-bottom-color:var(--divider)!important}
.leaflet-bar a:hover{background:var(--surface2)!important}
.pin{display:block;width:12px;height:12px;border:1.5px solid var(--accent);border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);transition:transform .15s}
.apin{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:var(--surface2);box-shadow:0 0 0 2px var(--bg),0 4px 10px rgba(0,0,0,.4);transition:transform .15s;overflow:visible}
.apin.broker{border-style:dashed}
.apin.p2{width:40px;height:40px}.apin.p3{width:48px;height:48px;border-width:2.5px}
.apin .av{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-family:var(--heading);font-weight:600;font-size:14px;color:var(--accent-hi);background:repeating-linear-gradient(135deg,#2d2b2b 0 3px,#242120 3px 6px)}
.apin.p3 .av{font-size:18px}
.apin .av img{width:100%;height:100%;object-fit:cover;display:block}
.apin .rk{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:8px;background:var(--accent);color:#1b1917;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.apin.sel{transform:scale(1.2);box-shadow:0 0 0 2px var(--bg),0 0 0 5px var(--accent)}
.leaflet-marker-icon:hover .apin{transform:scale(1.12)}
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.me-card{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;margin:0 10px 10px;padding:9px 10px;border:1px solid var(--divider);border-radius:var(--r);text-align:left;width:calc(100% - 20px)}
.me-card:hover{border-color:var(--accent)}
.me-card .av{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--accent);overflow:hidden;display:grid;place-items:center;font-family:var(--heading);font-weight:600;color:var(--accent-hi);background:var(--surface2)}
.me-card .n{font-family:var(--heading);font-size:16px;font-weight:600;line-height:1.1}
.me-card .s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:#7fb37a;box-shadow:0 0 0 3px rgba(127,179,122,.2)}
.gain{color:#7fb37a;font-variant-numeric:tabular-nums}
.pin.broker{background:transparent}
.pin.company{border-radius:1px;background:transparent;border-color:var(--text)}
.pin.event{transform:rotate(45deg);border-radius:1px;background:transparent;border-color:var(--accent-hi);border-style:dashed}
.pin.p2{width:15px;height:15px}.pin.p3{width:19px;height:19px;border-width:2px}
.country-label{display:inline-flex;align-items:baseline;gap:5px;padding:3px 8px;border:1px solid var(--accent);border-radius:3px;background:rgba(27,25,23,.9);color:var(--text);font-size:11px;white-space:nowrap;cursor:pointer;transform:translate(-50%,-50%)}
.country-label b{font-family:var(--heading);font-size:16px;color:var(--accent-hi);font-weight:600;font-variant-numeric:tabular-nums}
.tier{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid var(--divider);color:var(--muted)}
.tier.tx{border-color:rgba(239,233,225,.35);color:var(--text)}.tier.dns{border-color:var(--accent);color:var(--accent)}.tier.attested{background:var(--accent);border-color:var(--accent);color:#1b1917}
.auct{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-hi);border:1px dashed var(--accent);padding:1px 6px;border-radius:2px;white-space:nowrap}
.offer-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
.offer-form label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
.offer-form input{width:100%;height:34px;padding:0 8px;background:transparent;border:1px solid var(--divider);border-radius:var(--r);font-family:var(--mono);font-size:13px;caret-color:var(--accent)}
.offer-form input:focus{border-color:var(--accent)}
.lead-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(239,233,225,.08)}
.lead-row .r{font-family:var(--heading);font-size:18px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.lead-row .pts{font-family:var(--heading);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.status-lead{color:var(--accent-hi)}.status-out{color:#e07b5a}
.pin.sel{transform:scale(1.5);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.pin.event.sel{transform:rotate(45deg) scale(1.5)}
.leaflet-marker-icon:hover .pin{transform:scale(1.35)}
.cluster{display:inline-flex;align-items:center;justify-content:center;padding:0 9px;height:24px;border-radius:12px;border:1px solid var(--accent);background:rgba(27,25,23,.92);color:var(--accent-hi);font-family:var(--mono);font-weight:600;font-size:12px;box-shadow:0 0 0 3px rgba(194,141,65,.14);white-space:nowrap;font-variant-numeric:tabular-nums}
.leaflet-div-icon{background:none;border:0}
.maptools{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:500;display:flex;gap:8px}
.maptools .seg{background:rgba(27,25,23,.9);backdrop-filter:blur(8px)}
.legend{position:absolute;left:14px;bottom:26px;z-index:500;display:flex;gap:14px;padding:6px 10px;background:rgba(27,25,23,.85);border:1px solid var(--divider);border-radius:var(--r);font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend .pin{width:9px;height:9px;box-shadow:none}
.layout-floating .legend{left:372px}
.layout-floating .rcard .k>span:last-child{display:none}
#listview{position:absolute;inset:0;z-index:450;background:var(--bg);overflow:auto;display:none;padding:58px 24px 24px}
#listview th{top:0}
.layout-floating #listview{padding-left:372px}
#mapwrap:has(#listview.on) .legend{display:none}
#listview.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:400;padding:10px 10px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:var(--bg)}
td{padding:9px 10px;border-bottom:1px solid var(--divider);vertical-align:middle}
tbody tr:hover{background:rgba(239,233,225,.03)}
tbody tr.sel{background:rgba(194,141,65,.07)}
td .t{font-family:var(--heading);font-size:16px;font-weight:600}
.bar{height:3px;background:var(--divider);border-radius:2px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}

/* layouts */
.layout-floating aside#side{position:absolute;left:14px;top:14px;bottom:14px;z-index:600;width:340px;border:1px solid var(--divider);border-radius:var(--r-lg);background:rgba(27,25,23,.88);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.layout-split aside#side{width:50%}
.layout-split #mapwrap{border-left:0}

/* drawer */
#drawer{display:none;flex-direction:column;min-height:0;background:var(--surface);z-index:650}
.open #drawer{display:flex}
.drawer-side #drawer{grid-column:2;border-left:1px solid var(--divider);overflow:hidden}
.drawer-side.open #mapwrap{grid-template-columns:1fr 380px}
.drawer-card #drawer{position:absolute;top:14px;right:14px;width:360px;max-height:calc(100% - 28px);border:1px solid var(--divider);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.drawer-sheet #drawer{position:absolute;left:0;right:0;bottom:0;height:52%;border-top:1px solid var(--accent-deep);border-radius:12px 12px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.45)}
.drawer-sheet .legend{display:none}
.layout-floating.drawer-sheet #drawer{left:368px}
.d-head{padding:16px 18px 12px;border-bottom:1px solid var(--divider);display:grid;grid-template-columns:1fr auto;gap:4px 10px;flex:none}
.d-head .x{grid-row:1/3;width:28px;height:28px;color:var(--muted);border-radius:50%;justify-self:end;align-self:start}
.d-head .kicker{min-width:0}
.d-head .tier,.d-head .tag{position:static;display:inline-flex}
.d-head .x:hover{color:var(--text);background:rgba(239,233,225,.08)}
.d-title{font-family:var(--heading);font-size:26px;font-weight:600;line-height:1.05}
.d-title.mono{font-family:var(--mono);font-size:20px;font-weight:400;letter-spacing:-.01em}
.d-sub{font-size:12px;color:var(--muted);grid-column:1}
.d-body{overflow:auto;padding:4px 18px 18px;flex:1}
.d-sec{padding:14px 0;border-bottom:1px solid var(--divider)}.d-sec:last-child{border-bottom:0}
.d-sec h4{margin:0 0 8px;font-family:var(--body);font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font-family:var(--heading);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(239,233,225,.07)}
.row:last-child{border-bottom:0}
.row button.lnk{color:var(--text);padding:0;text-align:left;border:0}
.row button.lnk:hover{color:var(--accent)}
.match{display:grid;grid-template-columns:1fr 36px;gap:2px 10px;padding:9px 0;border-bottom:1px solid rgba(239,233,225,.07)}
.match:last-child{border-bottom:0}
.match .n{grid-column:1;font-family:var(--heading);font-size:17px;font-weight:600;min-width:0}
.match .s{grid-column:2;grid-row:1/3;font-family:var(--heading);font-size:20px;color:var(--accent);text-align:right;align-self:center;font-variant-numeric:tabular-nums}
.match .why{grid-column:1;font-size:12px;color:var(--muted)}
.match .bar{grid-column:1/-1;margin-top:4px}
.d-actions{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--divider);flex:none;background:var(--surface)}
.d-actions .btn{flex:1}
.ai-note{font-size:11px;color:var(--faint);margin-top:8px;font-style:italic}

/* matches + leads views */
.pane{display:flex;flex:1;min-height:0}
.pane-left{width:380px;flex:none;border-right:1px solid var(--divider);display:flex;flex-direction:column;min-height:0}
.pane-main{flex:1;min-width:0;overflow:auto;padding:28px 32px}
.pane-main table{min-width:860px}
.pane-main td{white-space:nowrap}.pane-main td.why{white-space:normal;min-width:220px}
.pane-main h2{font-size:34px;font-weight:400;margin-bottom:4px}
.lead-sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.dlist{flex:1;overflow:auto}
.drow{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;padding:10px 16px;border-bottom:1px solid var(--divider);border-radius:0}
.drow:hover{background:rgba(239,233,225,.04)}
.drow[aria-selected="true"]{background:rgba(194,141,65,.08);box-shadow:inset 2px 0 0 var(--accent)}
.drow .n{font-family:var(--mono);font-size:14px}.drow .p{font-family:var(--mono);font-size:12px;color:var(--muted)}
.drow .m{grid-column:1/-1;font-size:11px;color:var(--faint)}
select.stage{background:var(--bg);border:1px solid var(--divider);border-radius:3px;padding:3px 6px;font-size:12px}
input.note{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--divider);padding:3px 0;font-size:13px}
input.note:focus{border-bottom-color:var(--accent)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-style:italic}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:var(--r);font-size:13px;z-index:1000;transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.mob-toggle{display:none}
.hcard{position:absolute;z-index:800;pointer-events:none;width:270px;background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 14px;display:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.hcard.on{display:block;opacity:1;transform:none}
.hcard .hd{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.hcard .nm{font-family:var(--heading);font-size:18px;font-weight:600;line-height:1.1}
.hcard .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hcard .bio{font-size:12px;color:var(--text);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.hcard .ft b{font-family:var(--heading);font-size:16px;color:var(--accent);font-weight:600}

@media (max-width:1240px){.proto label>span:first-child,.proto label{font-size:0}.proto .seg button{font-size:12px}.navtabs button{padding:6px 9px}}
@media (max-width:860px){
  body{grid-template-columns:1fr;grid-template-rows:56px 44px minmax(0,1fr)}
  .rail{grid-row:2;grid-column:1;flex-direction:row;overflow-x:auto;padding:4px 8px;gap:4px;border-right:0;border-bottom:1px solid var(--divider);align-items:center}
  .rail .brand,.rail .sep,.rail .cta,.rail .me-card{display:none}
  .rail button.nv{width:auto;white-space:nowrap;padding:6px 10px;font-size:13px}
  .rail button.nv[aria-current]{box-shadow:inset 0 -2px 0 var(--accent)}
  .views{grid-row:3}
  .top{grid-row:1}
  .top{gap:10px;padding:0 12px}.proto{display:none}.brand span{display:none}
  aside#side,.layout-floating aside#side,.layout-split aside#side{position:absolute;inset:auto 0 0 0;top:auto;width:100%;height:58%;z-index:600;border:0;border-top:1px solid var(--divider);border-radius:12px 12px 0 0;transform:translateY(100%);transition:transform .25s;background:var(--bg)}
  #explore.side-open aside#side{transform:none}
  .mob-toggle{display:inline-flex;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:620;background:var(--surface)}
  .side-open .mob-toggle{display:none}
.hcard{position:absolute;z-index:800;pointer-events:none;width:270px;background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 14px;display:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.hcard.on{display:block;opacity:1;transform:none}
.hcard .hd{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.hcard .nm{font-family:var(--heading);font-size:18px;font-weight:600;line-height:1.1}
.hcard .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hcard .bio{font-size:12px;color:var(--text);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.hcard .ft b{font-family:var(--heading);font-size:16px;color:var(--accent);font-weight:600}
  #drawer,.drawer-side #drawer,.drawer-card #drawer,.layout-floating.drawer-sheet #drawer{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;height:62%;max-height:none;border:0;border-top:1px solid var(--accent-deep);border-radius:12px 12px 0 0}
  .drawer-side.open #mapwrap{grid-template-columns:1fr 0}
  .legend,.layout-floating .legend{left:12px;bottom:70px}
  .pane-left{width:100%}.pane-main{display:none}.pane.sel .pane-left{display:none}.pane.sel .pane-main{display:block}
}
</style>
</head>
<body>
<nav class="rail" id="rail">
  <div class="brand"><i></i><span>Domainers Map</span></div>
  <button class="nv" data-view="explore" aria-current="page"><span class="ic"></span>Explore</button>
  <button class="nv" data-view="domainers"><span class="ic pt"></span>Domainers</button>
  <button class="nv" data-view="domains"><span class="ic ln"></span>Domains<span class="count" id="domainCount"></span></button>
  <button class="nv" data-view="companies"><span class="ic sq"></span>Companies</button>
  <button class="nv" data-view="matches"><span class="ic sq" style="border-radius:50% 2px 50% 2px"></span>Matches</button>
  <button class="nv" data-view="offers"><span class="ic" style="border-radius:2px 50% 50% 50%"></span>Offers<span class="count" id="outbidCount" style="display:none">0</span></button>
  <button class="nv" data-view="events"><span class="ic dm"></span>Events<span class="count" id="eventCount"></span></button>
  <button class="nv" data-view="rank"><span class="ic ln" style="border-width:1.5px 0 0 0;height:1px;margin-top:0"></span>Today</button>
  <button class="nv" data-view="leads"><span class="ic sq" style="border-radius:2px;border-style:double"></span>Leads<span class="count" id="leadCount">0</span></button>
  <div class="sep"></div>
  <button class="nv" data-view="grow"><span class="ic" style="border-style:dotted"></span>Grow</button>
  <button class="btn primary cta" onclick="toast('Listing editor ships with inventory CRUD')">+ List a domain</button>
  <button class="me-card" id="meCard" style="margin:0;width:100%"></button>
</nav>
<header class="top">
  <div class="navtabs" id="tabs" style="display:none"></div>
  <div class="kicker" id="viewTitle" style="font-size:11px">Explore</div>
  <div class="proto">
    <label>Layout <span class="seg" id="layoutSeg"><button data-v="sidebar" aria-pressed="true">Sidebar</button><button data-v="floating">Floating</button><button data-v="split">Split</button></span></label>
    <label>Drawer <span class="seg" id="drawerSeg"><button data-v="side" aria-pressed="true">Side</button><button data-v="card">Card</button><button data-v="sheet">Sheet</button></span></label>
    <div class="live" title="Sample counters"><i></i><span id="liveCount">—</span></div>
    <div class="avatar" id="meAvatar" title="Signed in — prototype">HN</div>
  </div>
</header>
<main class="views">
<section id="explore" class="view on layout-sidebar drawer-side">
  <aside id="side">
    <div class="side-head">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search people, companies, domains, cities…" autocomplete="off">
      </div>
      <div class="chips" id="typeChips">
        <button class="chip" data-t="all" aria-pressed="true">All</button>
        <button class="chip" data-t="investor">Investors</button>
        <button class="chip" data-t="broker">Brokers</button>
        <button class="chip" data-t="company">Companies</button>
        <button class="chip" data-t="domain">Domains</button>
        <button class="chip" data-t="event">Events</button>
      </div>
      <div class="chiprow"><span class="lbl">TLD</span><div class="chips" id="tldChips"></div></div>
      <div class="chiprow"><span class="lbl">Region</span><div class="chips" id="regionChips">
        <button class="chip" data-r="Americas">Americas</button><button class="chip" data-r="Europe">Europe</button><button class="chip" data-r="MEA" title="Middle East &amp; Africa">MEA</button><button class="chip" data-r="APAC" title="Asia-Pacific">APAC</button>
      </div></div>
      <div class="chiprow"><span class="lbl">Only</span><div class="chips"><button class="chip" id="verifiedChip">Verified</button><button class="chip" id="viewportChip" aria-pressed="true">In view</button></div></div>
    </div>
    <div class="results-bar"><span id="resultCount">—</span><label>Sort <select id="sort"><option value="relevance">Sponsored first</option><option value="points">Reputation</option><option value="deals">Most active</option><option value="price">Asking price</option><option value="name">Name</option></select></label></div>
    <div id="results"></div>
  </aside>

  <div id="mapwrap">
    <div id="map"></div>
    <div class="maptools"><span class="seg" id="modeSeg"><button data-v="map" aria-pressed="true">Map</button><button data-v="list">List</button></span><span class="seg"><button id="streetsBtn" aria-pressed="false" title="OpenStreetMap street tiles">Streets</button></span></div>
    <div class="legend"><span><i class="pin"></i>Investor</span><span><i class="pin broker"></i>Broker</span><span><i class="pin company"></i>Company</span><span><i class="pin event"></i>Event</span><span><span class="cluster" style="height:16px;font-size:9px;padding:0 5px;box-shadow:none">+N</span>more</span></div>
    <button class="btn mob-toggle" id="mobToggle">Show list</button>
    <div id="listview"><table><thead><tr><th>Name</th><th>Type</th><th>Location</th><th>TLDs / Industry</th><th>Activity</th><th></th></tr></thead><tbody id="listBody"></tbody></table></div>
    <div id="drawer" role="dialog" aria-label="Details"></div>
  </div>
  <div class="hcard" id="hcard" role="tooltip"></div>
</section>

<section id="matches" class="view">
  <div class="pane" id="matchPane">
    <div class="pane-left">
      <div class="side-head"><div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="mq" type="search" placeholder="Search your inventory…"></div></div>
      <div class="dlist" id="domainList"></div>
    </div>
    <div class="pane-main" id="matchMain"></div>
  </div>
</section>

<section id="offers" class="view">
  <div class="pane-main" id="offersMain" style="width:100%"></div>
</section>

<section id="domainers" class="view"><div class="pane-main" id="domainersMain" style="width:100%"></div></section>
<section id="domains" class="view"><div class="pane-main" id="domainsMain" style="width:100%"></div></section>
<section id="companies" class="view"><div class="pane-main" id="companiesMain" style="width:100%"></div></section>
<section id="events" class="view"><div class="pane-main" id="eventsMain" style="width:100%"></div></section>
<section id="grow" class="view"><div class="pane-main" id="growMain" style="width:100%"></div></section>

<section id="rank" class="view">
  <div class="pane-main" id="rankMain" style="width:100%"></div>
</section>

<section id="leads" class="view">
  <div class="pane-main" id="leadsMain" style="width:100%"></div>
</section>
</main>

<div class="toast" id="toast"></div>

<script>
const REGION={NL:'Europe',US:'Americas',CA:'Americas',BR:'Americas',MX:'Americas',NO:'Europe',DE:'Europe',GB:'Europe',PT:'Europe',SE:'Europe',CH:'Europe',IE:'Europe',PL:'Europe',FR:'Europe',IN:'APAC',JP:'APAC',SG:'APAC',AU:'APAC',KR:'APAC',NG:'MEA',KE:'MEA',AE:'MEA'};
const COUNTRY={NL:'Netherlands',US:'United States',CA:'Canada',BR:'Brazil',MX:'Mexico',NO:'Norway',DE:'Germany',GB:'United Kingdom',PT:'Portugal',SE:'Sweden',CH:'Switzerland',IE:'Ireland',PL:'Poland',FR:'France',IN:'India',JP:'Japan',SG:'Singapore',AU:'Australia',KR:'South Korea',NG:'Nigeria',KE:'Kenya',AE:'UAE'};
const STAGES=['New','Contacted','Negotiating','Won','Lost'];
const LS='dmap.v1';
const store=JSON.parse(localStorage.getItem(LS)||'{}');
const save=()=>localStorage.setItem(LS,JSON.stringify(store));
store.leads=store.leads||[];store.layout=store.layout||'sidebar';store.drawer=store.drawer||'side';store.offers=store.offers||{};store.notifs=store.notifs||[];
const ISO={NL:'528',US:'840',CA:'124',BR:'076',MX:'484',NO:'578',DE:'276',GB:'826',PT:'620',SE:'752',CH:'756',IE:'372',PL:'616',FR:'250',IN:'356',JP:'392',SG:'702',AU:'036',KR:'410',NG:'566',KE:'404',AE:'784'};
const TIER={x:'X verified',dns:'DNS verified',attested:'Attested'};
let ME='p1';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n>=1e6?'$'+(n/1e6).toFixed(n%1e6?2:0).replace(/\.?0+$/,'')+'M':n>=1e3?'$'+Math.round(n/1e3)+'k':'$'+n;
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

let DB,items=[],byId={},map,layer,countryLayer,labelLayer,selected=null,mode='map';
const F={q:'',type:'all',tlds:new Set(),regions:new Set(),verified:false,viewport:true,sort:'relevance'};

fetch('data/seed.json').then(r=>r.json()).then(d=>{DB=d;init();});

function init(){
  ME=DB._me||'p1';
  DB.people.forEach(p=>{p.points=calcPoints(p);});
  const ranked=[...DB.people].sort((a,b)=>b.points-a.points);ranked.forEach((p,i)=>p.rank=i+1);
  DB.people.forEach(p=>items.push({...p,kind:p.type,label:p.name,sub:p.org,loc:`${p.city}, ${COUNTRY[p.country]}`,region:REGION[p.country]}));
  DB.companies.forEach(c=>items.push({...c,kind:'company',label:c.name,sub:c.industry,loc:`${c.city}, ${COUNTRY[c.country]}`,region:REGION[c.country],tlds:['.'+c.currentDomain.split('.').slice(1).join('.')]}));
  DB.domains.forEach(d=>{const o=DB.people.find(p=>p.id===d.ownerId);items.push({...d,kind:'domain',label:d.name,tld:'.'+d.name.split('.').slice(1).join('.'),tlds:['.'+d.name.split('.').slice(1).join('.')],lat:o.lat,lng:o.lng,city:o.city,country:o.country,loc:`${o.city}, ${COUNTRY[o.country]}`,region:REGION[o.country],owner:o});});
  DB.events.forEach(e=>items.push({...e,kind:'event',label:e.name,sub:e.kind,loc:`${e.city}, ${COUNTRY[e.country]}`,region:REGION[e.country],tlds:[]}));
  items.forEach(i=>byId[i.id]=i);
  // TLD chips from data
  const tlds=[...new Set(items.flatMap(i=>i.tlds||[]))].filter(t=>['.com','.ai','.io','.de','.co.uk','.africa','.ae','.jp'].includes(t));
  $('#tldChips').innerHTML=tlds.map(t=>`<button class="chip tld" data-tld="${t}">${t}</button>`).join('');
  $('#tldChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const t=b.dataset.tld;F.tlds.has(t)?F.tlds.delete(t):F.tlds.add(t);b.setAttribute('aria-pressed',F.tlds.has(t));refresh();};
  $('#typeChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;F.type=b.dataset.t;$$('#typeChips .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));refresh();};
  $('#regionChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const r=b.dataset.r;F.regions.has(r)?F.regions.delete(r):F.regions.add(r);b.setAttribute('aria-pressed',F.regions.has(r));refresh();};
  $('#verifiedChip').onclick=e=>{F.verified=!F.verified;e.target.setAttribute('aria-pressed',F.verified);refresh();};
  $('#viewportChip').onclick=e=>{F.viewport=!F.viewport;e.target.setAttribute('aria-pressed',F.viewport);refresh();};
  $('#q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();refresh();};
  $('#sort').onchange=e=>{F.sort=e.target.value;refresh();};
  $('#mobToggle').onclick=()=>$('#explore').classList.add('side-open');
  seg('#layoutSeg',store.layout,v=>{store.layout=v;save();applyChrome();});
  seg('#drawerSeg',store.drawer,v=>{store.drawer=v;save();applyChrome();});
  seg('#modeSeg','map',v=>{mode=v;$('#listview').classList.toggle('on',v==='list');});
  $('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;showView(b.dataset.view);};
  $('#rail').onclick=e=>{const b=e.target.closest('button.nv');if(!b)return;showView(b.dataset.view);};
  $('#domainCount').textContent=DB.domains.filter(d=>d.status!=='sold').length;$('#eventCount').textContent=DB.events.length;
  $('#mq').oninput=renderMatches;
  // Resolve remote avatars once (blob URL) so every pin reuses one request instead of hammering the avatar proxy.
  DB.people.filter(p=>p.avatar).forEach(p=>{const url=p.avatar;p.avatar=null;fetch(url,{mode:'cors',referrerPolicy:'no-referrer'}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{const o=URL.createObjectURL(b);p.avatar=o;if(byId[p.id])byId[p.id].avatar=o;renderMe();refresh();if(selected)renderDrawer();}).catch(()=>{p.avatar=url;if(byId[p.id])byId[p.id].avatar=url;renderMe();refresh();});});
  initMap();applyChrome();refresh();renderMatches();renderLeads();renderOffers();renderRank();renderMe();
}
function calcPoints(p){
  const listed=DB.domains.filter(d=>d.ownerId===p.id).length;
  const offersMade=Object.values(DB.offers||{}).flat().filter(o=>o.bidderId===p.id).length;
  const bonus=p.id===ME?GROW.filter(a=>isDone(a)).reduce((s,a)=>s+(a.pts||0),0):0;
  return Math.round(({x:10,dns:25,attested:40}[p.tier]||0)+(p.org?5:0)+(p.focus.length?5:0)+listed*4+p.deals12m*1.5+offersMade*2+Math.min(p.portfolio/200,10)+bonus);
}
function recomputePoints(){DB.people.forEach(p=>{p.points=calcPoints(p);});[...DB.people].sort((a,b)=>b.points-a.points).forEach((p,i)=>{p.rank=i+1;const it=byId[p.id];if(it){it.points=p.points;it.rank=p.rank;}});}
const TOP_N=20;
function visibleAt(i,z){if(i.kind!=='investor'&&i.kind!=='broker')return z>3;const plan=i.id===ME?(store.plan||'free'):(i.sponsored?'world':'free');if(z<=3)return i.rank<=TOP_N||plan==='world';if(z<=5)return i.points>=40||plan!=='free';return true;}
function tierOf(i){const plan=i.id===ME?(store.plan||'free'):'free';return (i.rank<=TOP_N||plan==='world')?'world':(i.points>=40||plan==='country')?'country':'city';}
function pinSize(i){return i.points>=80?'p3':i.points>=40?'p2':''}
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function avatarHTML(i,cls){return `<span class="${cls||'av'}">${initials(i.label||i.name)}${i.avatar?`<img src="${i.avatar}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:''}</span>`;}
function renderMe(){const me=byId[ME];if(!me)return;$('#meCard').innerHTML=`<span class="av" style="position:relative">${initials(me.name)}${me.avatar?`<img class="avatar-img" src="${me.avatar}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" style="position:absolute;inset:0">`:''}</span><span><span class="n">${esc(me.name)}</span><div class="s">#${me.rank} · ${me.points} pts${me.xHandle?' · @'+esc(me.xHandle):''}</div></span>`;$('#meCard').onclick=()=>select(ME,true);
  const av=$('#meAvatar');av.textContent=initials(me.name);av.style.position='relative';av.style.overflow='hidden';av.querySelectorAll('img').forEach(i=>i.remove());if(me.avatar){const img=new Image();img.className='avatar-img';img.referrerPolicy='no-referrer';img.alt='';img.style.position='absolute';img.style.inset='0';img.onload=()=>av.appendChild(img);img.src=me.avatar;}
  $('#liveCount').textContent=`${3+Math.floor(DB.people.length/8)} online · ${DB.people.length} members`;}
function tierChip(i){return i.tier?`<span class="tier ${i.tier==='x'?'tx':i.tier}">${TIER[i.tier]}</span>`:''}
function seg(sel,initial,cb){const el=$(sel);el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===initial));el.onclick=e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.v);};}
function applyChrome(){const ex=$('#explore');ex.className=`view ${ex.classList.contains('on')?'on':''} layout-${store.layout} drawer-${store.drawer} ${selected?'open':''}`;setTimeout(()=>map.invalidateSize(),260);}
const VIEW_TITLES={explore:'Explore',domainers:'Domainers',domains:'Domains',companies:'Companies',matches:'Matches',offers:'Offers',events:'Events',rank:'Today',leads:'Leads',grow:'Grow'};
function showView(v){$$('.view').forEach(s=>s.classList.toggle('on',s.id===v));$$('#rail button.nv').forEach(b=>b.toggleAttribute('aria-current',b.dataset.view===v));$('#viewTitle').textContent=VIEW_TITLES[v]||v;if(v==='explore')setTimeout(()=>map.invalidateSize(),50);if(v==='domainers')renderDomainers();if(v==='domains')renderDomains();if(v==='companies')renderCompanies();if(v==='events')renderEvents();if(v==='grow')renderGrow();if(v==='rank')renderRank();}

/* ---- map ---- */
function initMap(){
  map=L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:2}).setView([30,10],2);
  // Vector country base (Natural Earth via world-atlas). OSM street tiles are opt-in via the Streets toggle: the public tile server blocks some embedding origins.
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()).then(t=>{
    const fc=topojson.feature(t,t.objects.countries);fc.features=fc.features.filter(f=>f.id!=='010');
    countryLayer=L.geoJSON(fc,{interactive:false,style:{color:'rgba(239,233,225,.22)',weight:.6,fillColor:'#242120',fillOpacity:1}}).addTo(map).bringToBack();
    map.attributionControl.addAttribution('Natural Earth');
    countryLayer.on('click',e=>{const code=Object.keys(ISO).find(k=>ISO[k]===e.layer.feature.id);if(code&&countryCounts()[code])map.flyTo(countryCenter(code),5,{duration:.7});});
    styleCountries();
  }).catch(()=>{});
  labelLayer=L.layerGroup().addTo(map);
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18});
  $('#streetsBtn').onclick=e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',on);on?tiles.addTo(map):map.removeLayer(tiles);};
  L.control.zoom({position:'bottomright'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('moveend zoomend',()=>{if(F.viewport)refresh();else drawMarkers(filtered());});
}
const countryView=()=>map.getZoom()<=3;
function countryCounts(){const c={};items.filter(i=>i.kind==='investor'||i.kind==='broker').forEach(i=>c[i.country]=(c[i.country]||0)+1);return c;}
function countryCenter(code){const m=items.filter(i=>i.country===code&&i.kind!=='domain');return [m.reduce((a,i)=>a+i.lat,0)/m.length,m.reduce((a,i)=>a+i.lng,0)/m.length];}
function styleCountries(){
  if(!countryLayer)return;const c=countryCounts(),mx=Math.max(...Object.values(c)),on=countryView();
  countryLayer.setStyle(f=>{const code=Object.keys(ISO).find(k=>ISO[k]===f.id),n=code?c[code]||0:0;return {color:on&&n?'rgba(194,141,65,.55)':'rgba(239,233,225,.22)',weight:on&&n?.9:.6,fillColor:on&&n?`rgba(194,141,65,${.12+.5*(n/mx)})`:'#242120',fillOpacity:1};});
}
function drawCountryLabels(){
  labelLayer.clearLayers();if(!countryView())return;
  const c=countryCounts(),z=map.getZoom(),cells={},cw=z<=2?110:70,ch=z<=2?60:48;
  // Countries whose members already show a worldwide-tier pin get their count as a badge on that pin instead of a separate label.
  const pinned=new Set(items.filter(i=>(i.kind==='investor'||i.kind==='broker')&&visibleAt(i,z)).map(i=>i.country));
  Object.entries(c).filter(([code])=>!pinned.has(code)).forEach(([code,n])=>{const ll=countryCenter(code),p=map.project(ll,z),k=Math.floor(p.x/cw)+'_'+Math.floor(p.y/ch);(cells[k]=cells[k]||[]).push({code,n,ll,p});});
  // merge neighbouring cells whose labels would still touch
  const groups=Object.values(cells);for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){const a=groups[i],b=groups[j];if(!a.length||!b.length)continue;const ca=a.reduce((s,x)=>s+x.p.x,0)/a.length,cb=b.reduce((s,x)=>s+x.p.x,0)/b.length,ya=a.reduce((s,x)=>s+x.p.y,0)/a.length,yb=b.reduce((s,x)=>s+x.p.y,0)/b.length;if(Math.abs(ca-cb)<cw*.9&&Math.abs(ya-yb)<ch*.9){a.push(...b);b.length=0;}}
  groups.filter(g=>g.length).forEach(g=>{
    const n=g.reduce((a,x)=>a+x.n,0),lat=g.reduce((a,x)=>a+x.ll[0],0)/g.length,lng=g.reduce((a,x)=>a+x.ll[1],0)/g.length;
    const text=g.length===1?g[0].code:`${g.length} countries`;
    // push the label below any visible pin it would collide with
    let anchor=[lat,lng];const pt=map.project(anchor,z);const near=items.filter(i=>(i.kind==='investor'||i.kind==='broker')&&visibleAt(i,z)).map(i=>map.project([i.lat,i.lng],z)).filter(q=>Math.abs(q.x-pt.x)<84&&Math.abs(q.y-pt.y)<64);
    if(near.length){const maxY=Math.max(...near.map(q=>q.y));anchor=map.unproject(L.point(pt.x,maxY+24+16+8),z);}
    if(g.length>4)return;
    const m=L.marker([anchor.lat??anchor[0],anchor.lng??anchor[1]],{icon:L.divIcon({html:`<span class="country-label"><b>${n}</b>${text}</span>`,iconSize:[0,0]}),zIndexOffset:500,title:g.map(x=>COUNTRY[x.code]).join(', ')});
    m.on('click',()=>g.length===1?map.flyTo(g[0].ll,5,{duration:.7}):map.fitBounds(L.latLngBounds(g.map(x=>x.ll)).pad(.5),{maxZoom:5}));labelLayer.addLayer(m);
  });
}
function drawMarkers(list){
  layer.clearLayers();styleCountries();drawCountryLabels();
  $('.legend').style.display=countryView()&&!selected?'none':'';
  const z=map.getZoom(),cells={};
  list=list.filter(i=>visibleAt(i,z)||(selected&&(selected.id===i.id||selected.ownerId===i.id)));
  list.filter(i=>i.kind!=='domain').forEach(i=>{const p=map.project([i.lat,i.lng],z);const k=Math.floor(p.x/64)+'_'+Math.floor(p.y/64);(cells[k]=cells[k]||[]).push(i);});
  Object.values(cells).forEach(g=>{
    if(g.length===1||z>=10){g.forEach(i=>{
      const sel=selected&&(selected.id===i.id||(selected.kind==='domain'&&selected.ownerId===i.id));
      const isP=i.kind==='investor'||i.kind==='broker';
      const cc=countryView()&&isP?countryCounts()[i.country]:0;
      const html=isP?`<span class="apin ${i.kind} ${pinSize(i)}${sel?' sel':''}">${avatarHTML(i)}${cc>1?`<span class="cluster" style="position:absolute;right:-14px;top:-8px;height:18px;font-size:10px;padding:0 6px">+${cc-1}</span>`:''}${i.rank<=20?`<span class="rk">#${i.rank}</span>`:''}</span>`:`<span class="pin ${i.kind}${sel?' sel':''}"></span>`;
      const sz=isP?(i.points>=80?48:i.points>=40?40:34):12;
      const m=L.marker([i.lat,i.lng],{icon:L.divIcon({html,iconSize:[sz,sz]}),title:i.label,zIndexOffset:sel?1000:(isP?Math.round(i.points):0)});
      m.on('click',()=>select(i.id));m.on('mouseover',e=>{const ex=$('#explore').getBoundingClientRect();showHover(i,e.originalEvent.clientX-ex.left,e.originalEvent.clientY-ex.top);});m.on('mouseout',hideHover);layer.addLayer(m);});return;}
    const lat=g.reduce((a,i)=>a+i.lat,0)/g.length,lng=g.reduce((a,i)=>a+i.lng,0)/g.length;
    const top=g.filter(i=>i.kind==='investor'||i.kind==='broker').sort((a,b)=>b.points-a.points)[0];
    const html=top?`<span style="position:relative;display:block;width:${top.points>=80?48:top.points>=40?40:34}px;height:${top.points>=80?48:top.points>=40?40:34}px"><span class="apin ${top.kind} ${pinSize(top)}">${avatarHTML(top)}</span><span class="cluster" style="position:absolute;right:-16px;top:-10px;height:20px;font-size:11px;padding:0 7px">+${g.length-1}</span></span>`:`<span class="cluster">+${g.length}</span>`;
    const sz=top?(top.points>=80?48:top.points>=40?40:34):24;
    const m=L.marker([lat,lng],{icon:L.divIcon({html,iconSize:[sz,sz]}),title:`${g.length} members`});
    m.on('click',()=>map.fitBounds(L.latLngBounds(g.map(i=>[i.lat,i.lng])).pad(.4),{maxZoom:Math.max(z+2,6)}));layer.addLayer(m);
  });
}

/* ---- filtering ---- */
function filtered(){
  const b=map.getBounds();
  let l=items.filter(i=>{
    if(F.type!=='all'&&i.kind!==F.type)return false;
    if(F.tlds.size&&!(i.tlds||[]).some(t=>F.tlds.has(t)))return false;
    if(F.regions.size&&!F.regions.has(i.region))return false;
    if(F.verified&&i.kind!=='event'&&i.kind!=='company'&&i.kind!=='domain'&&!i.verified)return false;
    if(F.viewport&&!b.contains([i.lat,i.lng]))return false;
    if(F.q){const h=[i.label,i.sub,i.loc,i.org,i.industry,i.currentDomain,...(i.focus||[]),...(i.tlds||[])].join(' ').toLowerCase();if(!h.includes(F.q))return false;}
    return true;});
  const act=i=>i.deals12m||i.employees/4||0;
  if(F.sort==='relevance')l.sort((a,b)=>(b.sponsored?1:0)-(a.sponsored?1:0)||act(b)-act(a));
  if(F.sort==='points')l.sort((a,b)=>(b.points||0)-(a.points||0));
  if(F.sort==='deals')l.sort((a,b)=>act(b)-act(a));
  if(F.sort==='price')l.sort((a,b)=>(b.askingUSD||0)-(a.askingUSD||0));
  if(F.sort==='name')l.sort((a,b)=>a.label.localeCompare(b.label));
  return l;
}
function refresh(){const l=filtered();drawMarkers(F.viewport?l:filtered());renderResults(l);renderList(l);}
function kindLabel(i){return i.kind==='event'?i.kind:i.kind;}
function renderResults(l){
  $('#resultCount').textContent=`${l.length} result${l.length===1?'':'s'}${F.viewport?' in view':''}`;
  $('#results').innerHTML=l.length?l.map(i=>{
    const k=`<div class="k"><b>${i.kind}</b>${i.sponsored?'<span class="spons">Sponsored</span>':''}${tierChip(i)}${i.kind==='domain'&&auctionOf(i.id)?`<span class="auct">${endsIn(i.id)}</span>`:''}<span style="margin-left:auto">${esc(i.city)}</span></div>`;
    if(i.kind==='domain')return `<button class="rcard" data-id="${i.id}" aria-selected="${selected&&selected.id===i.id}">${k}<div class="t mono">${esc(i.name)}</div><div class="p">${priceLabel(i)}</div><div class="m">${esc(i.category)} · held by ${esc(i.owner.name)}${offersOf(i.id).length?` · ${offersOf(i.id).length} offer${offersOf(i.id).length>1?'s':''}`:''}</div></button>`;
    if(i.kind==='company')return `<button class="rcard" data-id="${i.id}" aria-selected="${selected&&selected.id===i.id}">${k}<div class="t">${esc(i.name)}</div><div class="p muted">${esc(i.stage)}</div><div class="m">${esc(i.industry)} · <span class="mono">${esc(i.currentDomain)}</span></div></button>`;
    if(i.kind==='event')return `<button class="rcard" data-id="${i.id}" aria-selected="${selected&&selected.id===i.id}">${k}<div class="t">${esc(i.name)}</div><div class="p muted">${fmtDate(i.date)}</div><div class="m">${esc(i.sub)}</div></button>`;
    return `<button class="rcard" data-id="${i.id}" aria-selected="${selected&&selected.id===i.id}">${k}<div class="t">${esc(i.name)}</div><div class="p muted num">${i.points} pts · #${i.rank}</div><div class="m">${i.org?esc(i.org)+' · ':''}${i.tlds.map(t=>`<span class="mono">${t}</span>`).join(' ')}</div></button>`;
  }).join(''):'<div class="empty">Nothing here. Pan the map or clear a filter.</div>';
  $('#results').onclick=e=>{const b=e.target.closest('.rcard');if(b)select(b.dataset.id,true);};
  $('#results').onmouseover=e=>{const b=e.target.closest('.rcard');if(b&&byId[b.dataset.id])hoverAt(byId[b.dataset.id],b);};

}
function renderList(l){
  $('#listBody').innerHTML=l.map(i=>`<tr data-id="${i.id}" class="${selected&&selected.id===i.id?'sel':''}"><td><span class="t ${i.kind==='domain'?'mono':''}">${esc(i.label)}</span>${i.sponsored?' <span class="spons">Sponsored</span>':''}<div class="muted" style="font-size:11px">${esc(i.sub||i.owner?.name||'')}</div></td><td><span class="tag">${i.kind}</span></td><td>${esc(i.loc)}</td><td class="mono" style="font-size:12px">${i.kind==='company'?esc(i.industry):(i.tlds||[]).join(' ')}</td><td class="num">${i.kind==='domain'?priceLabel(i):i.kind==='company'?money(i.fundingUSD)+' raised':i.kind==='event'?fmtDate(i.date):i.points+' pts · '+i.deals12m+' deals'}</td><td><button class="btn sm" data-open="${i.id}">Open</button></td></tr>`).join('');
  $('#listBody').onclick=e=>{const b=e.target.closest('[data-open]');if(b)select(b.dataset.open,true);};
}

/* ---- offers & outbid (proxy bids) ---- */
function offersOf(id){return [...(DB.offers[id]||[]),...(store.offers[id]||[])].sort((a,b)=>a.at.localeCompare(b.at)||a.amount-b.amount);}
function auctionOf(id){return DB.auctions[id]||null;}
function leading(id){const o=offersOf(id);if(!o.length)return null;const byB={};o.forEach(x=>{const c=byB[x.bidderId];if(!c||x.max>c.max)byB[x.bidderId]={...x};});const arr=Object.values(byB).sort((a,b)=>b.max-a.max||a.at.localeCompare(b.at));const top=arr[0],second=arr[1];const inc=increment(top.max);const price=second?Math.min(top.max,Math.max(second.max+inc,top.amount)):top.amount;return {...top,price,count:arr.length,bidders:arr};}
function increment(v){return v>=500000?10000:v>=100000?5000:v>=20000?1000:500;}
function priceLabel(d){const l=leading(d.id);if(d.status==='sold')return 'Sold';if(l)return money(l.price)+' bid';return d.status==='make-offer'?'Make offer':money(d.askingUSD);}
function endsIn(id){const a=auctionOf(id);if(!a)return '';const ms=new Date(a.endsAt)-Date.now();if(ms<=0)return 'Ended';const h=Math.floor(ms/36e5);return h>=48?`Ends in ${Math.floor(h/24)}d`:h>=1?`Ends in ${h}h`:`Ends in ${Math.max(1,Math.floor(ms/6e4))}m`;}
function myStatus(id){const l=leading(id);if(!l)return null;const mine=l.bidders.find(b=>b.bidderId===ME);if(!mine)return null;return l.bidderId===ME?'leading':'outbid';}
function placeOffer(id,amount,max,bidder){
  bidder=bidder||ME;amount=+amount||0;max=Math.max(+max||0,amount);
  const before=leading(id),d=byId[id];
  if(!amount){toast('Enter an amount');return;}
  if(before&&bidder===ME&&before.bidderId!==ME&&amount<before.price+increment(before.price)){toast(`Minimum offer is ${money(before.price+increment(before.price))}`);return;}
  (store.offers[id]=store.offers[id]||[]).push({bidderId:bidder,amount,max,at:new Date().toISOString()});
  const after=leading(id);
  if(before&&before.bidderId!==after.bidderId&&before.bidderId===ME)notify(`Outbid on ${d.name} — ${money(before.price)} → ${money(after.price)}`,id);
  if(bidder===ME){if(after.bidderId===ME)toast(`You lead ${d.name} at ${money(after.price)}`);else{notify(`Outbid instantly on ${d.name} — a proxy bid up to ${money(after.price)} beat your ${money(max)}`,id);toast('Outbid instantly — raise your max');}}
  save();renderDrawer();renderOffers();renderRank();refresh();
}
function acceptOffer(id){const l=leading(id),d=byId[id];if(!l)return;d.status='sold';const t=byId[l.bidderId];if(t&&!store.leads.some(x=>x.targetId===t.id&&x.domainId===id))store.leads.unshift({id:'l'+Date.now(),targetId:t.id,domainId:id,stage:'Won',note:`Accepted offer ${money(l.price)}`,added:new Date().toISOString().slice(0,10)});save();renderLeads();renderDrawer();renderRank();refresh();toast(`Accepted ${money(l.price)} for ${d.name} — lead marked Won`);}
function notify(msg,id){store.notifs.unshift({msg,id,at:new Date().toISOString(),read:false});save();updateBadges();}
function updateBadges(){const n=store.notifs.filter(x=>!x.read).length;const b=$('#outbidCount');b.textContent=n;b.style.display=n?'':'none';}
function simulateRival(){const mine=DB.domains.filter(d=>myStatus(d.id)==='leading');if(!mine.length){toast('You lead no offers to be outbid on');return;}const d=mine[Math.floor(Math.random()*mine.length)],l=leading(d.id),rivals=DB.companies.filter(c=>c.wants.includes(d.name)).concat(DB.people.filter(p=>p.id!==ME));const r=rivals[Math.floor(Math.random()*rivals.length)];const amt=l.price+increment(l.price),mx=Math.round(amt*(1.1+Math.random()*.3)/500)*500;placeOffer(d.id,amt,mx,r.id);}
function offerSection(d){
  const l=leading(d.id),a=auctionOf(d.id),st=myStatus(d.id),own=d.ownerId===ME;
  const reserve=a?(l&&l.price>=a.reserve?'<span class="muted">Reserve met</span>':`<span class="muted">Reserve ${money(a.reserve)} not met</span>`):'';
  const min=l?l.price+increment(l.price):(d.status==='make-offer'?Math.round(d.askingUSD*.5/500)*500:Math.round(d.askingUSD*.6/500)*500);
  if(own)return `<div class="d-sec"><h4>Offers received${a?` · <span class="auct">${endsIn(d.id)}</span>`:''}</h4>
    <div class="stats"><div class="stat"><b>${l?money(l.price):'—'}</b><span>${l?'current high':'no offers yet'}</span></div><div class="stat"><b>${l?l.count:0}</b><span>bidder${l&&l.count===1?'':'s'}</span></div><div class="stat"><b>${money(d.askingUSD)}</b><span>your asking</span></div></div>
    ${a?`<div style="font-size:12px;margin-top:8px">${reserve} · ends ${new Date(a.endsAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`:''}
    ${l?`<div style="margin-top:10px">${l.bidders.map((b,i)=>`<div class="row" style="font-size:12px"><span>${i===0?'<span class="status-lead">●</span> ':''}${esc(byId[b.bidderId]?.label||'Bidder')} <span class="muted">· ${byId[b.bidderId]?.city||''}</span></span><span style="display:flex;gap:8px;align-items:center"><span class="mono">${i===0?money(l.price):'≤ '+money(b.max)}</span>${i===0?`<button class="btn sm primary" onclick="acceptOffer('${d.id}')">Accept</button><button class="btn sm ghost" onclick="toast('Declined — bidder notified')">Decline</button>`:''}</span></div>`).join('')}</div>`:'<div class="ai-note">Buyers see this listing with a minimum offer of '+money(min)+'.</div>'}
  </div>`;
  return `<div class="d-sec"><h4>${a?'Auction':'Offers'}${a?` · <span class="auct">${endsIn(d.id)}</span>`:''}</h4>
    <div class="stats"><div class="stat"><b>${l?money(l.price):'—'}</b><span>${l?'current high':'no offers yet'}</span></div><div class="stat"><b>${l?l.count:0}</b><span>bidder${l&&l.count===1?'':'s'}</span></div><div class="stat"><b style="font-size:16px;line-height:1.5" class="${st==='leading'?'status-lead':st==='outbid'?'status-out':''}">${st==='leading'?'You lead':st==='outbid'?'Outbid':'—'}</b><span>your status</span></div></div>
    ${a?`<div style="font-size:12px;margin-top:8px">${reserve} · ends ${new Date(a.endsAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · soft close +${a.softCloseMin} min</div>`:''}
    ${d.status==='sold'?'':`<div class="offer-form"><div><label>Offer</label><input id="ofAmt" type="number" step="500" min="${min}" value="${min}"></div><div><label>Max (proxy)</label><input id="ofMax" type="number" step="500" placeholder="${money(min*1.2)}"></div><button class="btn primary" onclick="placeOffer('${d.id}',document.getElementById('ofAmt').value,document.getElementById('ofMax').value)">${l?'Raise':'Offer'}</button></div><div class="ai-note">Proxy bidding: we bid only as much as needed to keep you ahead, up to your max. You're notified the moment you're outbid.</div>`}
    ${l?`<div style="margin-top:10px">${l.bidders.slice(0,4).map((b,i)=>`<div class="row" style="font-size:12px"><span>${i===0?'<span class="status-lead">●</span> ':''}${b.bidderId===ME?'You':esc(byId[b.bidderId]?.label||'Bidder')}</span><span class="mono muted">${i===0?money(l.price):'≤ '+money(b.max)}</span></div>`).join('')}</div>`:''}
  </div>`;
}

/* ---- hover card ---- */
function hoverHTML(i){

function addLead(target,domainId){

  store.leads.unshift({id:'l'+Date.now(),targetId:target.id,domainId:domainId||null,stage:'New',note:'',added:new Date().toISOString().slice(0,10)});
  save();renderLeads();toast(`Added ${target.label} to leads`);
}
function scoreCompany(d,c){
  let s=0,why=[];
  if(c.wants.includes(d.name)){s+=55;why.push('on their wish list');}
  const sld=d.name.split('.')[0];
  if(c.name.toLowerCase().replace(/\s/g,'').includes(sld)){s+=25;why.push('matches brand name');}
  const ov=d.keywords.filter(k=>c.keywords.includes(k));if(ov.length){s+=Math.min(ov.length*12,24);why.push('keyword overlap: '+ov.join(', '));}
  if(c.currentDomain.endsWith('.io')||c.currentDomain.includes('-')||c.currentDomain.split('.').length>2)s+=6;
  if(c.fundingUSD>d.askingUSD*20)s+=8;else if(c.fundingUSD&&c.fundingUSD<d.askingUSD*3){s-=10;why.push('budget stretch');}
  return {score:Math.max(4,Math.min(98,s)),why:why.length?why.join(' · '):'weak semantic fit'};
}

function nearby(i){
  const km=(a,b)=>{const R=6371,dl=(b.lat-a.lat)*Math.PI/180,dg=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
  const n=items.filter(o=>o.id!==i.id&&o.kind!=='domain'&&o.kind!=='event'&&km(i,o)<600).sort((a,b)=>km(i,a)-km(i,b)).slice(0,4);
  return n.length?n.map(o=>`<button class="lnk" style="border:0;padding:0;color:var(--text);display:block;text-align:left" onclick="select('${o.id}',true)">${esc(o.label)} <span class="muted">· ${o.kind}, ${Math.round(km(i,o))} km</span></button>`).join(''):'No members within 600 km.';
}

  {id:'say_hi',t:'Say hi to a match',s:'A company or domainer the matcher paired you with',pts:10,action:'Meet →'},
  {id:'meetup',t:'Organize a meetup',s:'Domainers near you get notified',pts:150,action:'Plan it →'},
  {id:'x_bio',t:'Your page in your X bio',s:'+5 a day while your pinned post has the link',pts:5,done:true},
  {id:'lander',t:'Badge on your domain landers',s:'+1 a day per site, up to 3 sites',pts:3,done:true},
  {id:'dns',t:'Verify ownership by DNS',s:'+15 per listed domain, up to 10 — unlocks the DNS tier',pts:15,action:'Verify →'},
  {id:'priced',t:'List a domain with a price',s:'+5 each; priced listings get 3× the offers',pts:5,done:true},
  {id:'attest',t:'Attest a completed deal',s:'+100 when the counterparty confirms — unlocks the Attested tier',pts:100,action:'Attest →'},
  {id:'review',t:'Review a broker',s:'One you have actually worked with',pts:20,action:'Review →',isNew:true},
  {id:'email',t:'Confirm your email',s:'Tap the link in the email we sent you',pts:25,action:'Resend →',isNew:true},
  {id:'intro',t:'Your intro post',s:'Found: you’re X-verified',pts:0,done:true}
];
store.actions=store.actions||{};store.plan=store.plan||'free';
function isDone(a){return a.done||!!store.actions[a.id];}
function doAction(id){store.actions[id]=true;save();recomputePoints();renderMe();renderGrow();toast(`+${GROW.find(a=>a.id===id).pts} points`);}
function setPlan(p){store.plan=p;save();renderGrow();refresh();toast(p==='free'?'Plan cancelled':`${p==='world'?'World':'Country'} plan active — pin visibility updated`);}
function renderGrow(){
  const me=byId[ME],ranked=[...DB.people].sort((a,b)=>b.points-a.points),top20=ranked[Math.min(TOP_N-1,ranked.length-1)],above=ranked[me.rank-2];
  const toTop=Math.max(0,top20.points-me.points+1),done=GROW.filter(isDone),todo=GROW.filter(a=>!isDone(a)),next=todo[0];

  const invites=Object.keys(store.actions).filter(k=>k.startsWith('inv')).length;

  $('#growMain').innerHTML=`<div class="kicker">Grow</div><h2>Your spot on the map</h2>
  <div style="display:flex;gap:14px;align-items:center;margin:6px 0 18px"><span class="apin" style="width:56px;height:56px">${avatarHTML(me)}</span><div><div style="font-family:var(--heading);font-size:22px;font-weight:600">${esc(me.name)} ${tierChip(me)}</div><div class="muted">#${me.rank} of ${DB.people.length} domainers · ${me.points} points${me.xHandle?' · @'+esc(me.xHandle):''}</div></div></div>
  ${next?`<button class="btn" style="width:100%;justify-content:space-between;padding:12px 16px;margin-bottom:18px;background:var(--surface2);border-color:var(--surface2)" onclick="doAction('${next.id}')"><span><span style="color:var(--accent)">Next:</span> ${esc(next.t)} · +${next.pts}</span><span>›</span></button>`:''}
  <div style="border:1px solid var(--divider);border-radius:var(--r-lg);padding:18px;margin-bottom:18px">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${tile('city',esc(me.city),true,'✓ always visible')}${tile('country',COUNTRY[me.country],tier!=='city',tier!=='city'?'You’re here':`${Math.max(0,40-me.points)} points away · or Country plan`)}${tile('world','Worldwide',tier==='world',tier==='world'?'You’re here':`${toTop} points away · or World plan`)}</div>
    <div style="margin-top:16px;font-size:13px"><b style="font-family:var(--heading);font-size:18px">${me.points} points</b> · ${toTop?`${toTop} more to reach the top ${TOP_N}`:`you’re in the top ${TOP_N}`}</div><div class="bar" style="height:6px;margin:8px 0"><i style="width:${Math.min(100,Math.round(me.points/top20.points*100))}%"></i></div><div class="muted" style="font-size:12px">${above?`${above.points-me.points} points behind ${esc(above.name)} for #${me.rank-1}`:'You lead the board'}</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px">
    <div style="border:1px solid var(--divider);border-radius:var(--r-lg);padding:18px"><h4 class="kicker" style="margin:0 0 10px">Your link</h4><div style="display:flex;gap:8px"><input class="mono" readonly value="domainersmap.com/${esc(me.xHandle||me.id)}/invite" style="flex:1;height:36px;padding:0 10px;background:transparent;border:1px solid var(--divider);border-radius:var(--r);font-size:13px"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('domainersmap.com/${esc(me.xHandle||me.id)}/invite');toast('Copied')">Copy</button></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="toast('Opens an X compose in production')">Post it on X</button><div class="ai-note">+50 for every domainer who joins from it · ${invites} so far</div></div>
    <div style="border:1px solid var(--divider);border-radius:var(--r-lg);padding:18px"><h4 class="kicker" style="margin:0 0 10px">Your impact</h4><div class="stats"><div class="stat"><b>${invites}</b><span>domainers joined via you</span></div><div class="stat"><b>${Object.values(store.offers).flat().filter(o=>o.bidderId===ME).length}</b><span>offers made</span></div><div class="stat"><b>${store.leads.filter(l=>l.stage==='Won').length}</b><span>deals attested</span></div></div><div class="chips" style="margin-top:12px">${[['Verified',!!me.tier],['Recruiter',invites>0],['Host',!!store.actions.meetup],['Connector',!!store.actions.say_hi],['Dealmaker',store.leads.some(l=>l.stage==='Won')],['Reviewer',!!store.actions.review]].map(([r,on])=>`<span class="tag ${on?'accent':''}">${on?'✓ ':''}${r}</span>`).join('')}</div></div>
  </div>
  <div style="border:1px solid var(--divider);border-radius:var(--r-lg);padding:4px 18px;margin-top:18px"><h4 class="kicker" style="margin:14px 0 4px">Grow on the map</h4>${GROW.map(a=>{const d=isDone(a);return `<div class="row" style="padding:11px 0"><div><div style="font-family:var(--heading);font-size:17px;font-weight:600">${esc(a.t)} ${a.isNew&&!d?'<span class="tag fill" style="font-size:9px;padding:0 5px">NEW</span>':''}</div><div class="muted" style="font-size:12px">${esc(a.s)}</div></div><div style="text-align:right;white-space:nowrap">${d?'<span class="status-lead">✓</span>':`<div class="num" style="font-size:13px">+${a.pts}</div><button class="btn sm ghost" onclick="doAction('${a.id}')">${a.action}</button>`}</div></div>`;}).join('')}<div class="muted" style="padding:12px 0;font-size:12px"><span class="status-lead">✓</span> ${done.length} done · ${me.points} points</div></div>
  <div style="border:1px solid var(--accent-deep);border-radius:var(--r-lg);padding:18px;margin-top:18px"><h4 class="kicker" style="margin:0 0 4px">Get more out of Domainers Map</h4><div class="muted" style="font-size:13px;margin-bottom:14px">Stay visible whatever your rank, and get the extras. Your points and rank are never for sale.</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
      <div style="border:1px solid ${plan==='country'?'var(--accent)':'var(--divider)'};border-radius:var(--r);padding:16px"><div style="font-family:var(--heading);font-size:20px;font-weight:600">Country</div><div><b style="font-family:var(--heading);font-size:28px">$4</b> <span class="muted">/ month</span></div><ul style="margin:10px 0 14px;padding-left:16px;font-size:13px;color:var(--muted);line-height:1.7"><li>Your face across ${COUNTRY[me.country]}, whatever your rank</li><li>Profile refreshed from X every week</li><li>Keeps the map free for everyone</li></ul><button class="btn" style="width:100%" onclick="setPlan('${plan==='country'?'free':'country'}')">${plan==='country'?'Cancel Country':'Get Country'}</button></div>
      <div style="border:1px solid var(--accent);border-radius:var(--r);padding:16px;position:relative"><span class="kicker" style="position:absolute;right:14px;top:16px">Popular</span><div style="font-family:var(--heading);font-size:20px;font-weight:600">World</div><div><b style="font-family:var(--heading);font-size:28px">$12</b> <span class="muted">/ month</span></div><ul style="margin:10px 0 14px;padding-left:16px;font-size:13px;color:var(--muted);line-height:1.7"><li>The biggest pin and your name, worldwide</li><li>Followed backlinks to your domain landers</li><li>Profile refreshed from X every day</li><li>Buyer matches for your whole portfolio</li><li>Who viewed your profile <span class="tag" style="font-size:9px;padding:0 5px">soon</span></li></ul><button class="btn primary" style="width:100%" onclick="setPlan('${plan==='world'?'free':'world'}')">${plan==='world'?'Cancel World':'Get World'}</button></div>
    </div></div>`;
}

/* ---- offers view ---- */
function renderOffers(){
  updateBadges();
  const mine=DB.domains.filter(d=>offersOf(d.id).some(o=>o.bidderId===ME));
  const notifs=store.notifs.slice(0,8);
  $('#offersMain').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap"><div><div class="kicker">Offers &amp; auctions</div><h2>My offers</h2><p class="lead-sub">Proxy bids keep you ahead up to your max. Outbid alerts land here and in the Offers badge.</p></div><button class="btn" onclick="simulateRival()" title="Prototype only: a rival raises against one of your leading offers">Simulate rival bid</button></div>
  ${notifs.length?`<div style="border:1px solid var(--divider);border-radius:var(--r);padding:4px 14px;margin-bottom:22px">${notifs.map(n=>`<div class="row" style="font-size:13px"><span>${n.read?'':'<span class="status-out">●</span> '}${esc(n.msg)}</span><span style="display:flex;gap:10px;align-items:center"><span class="muted" style="font-size:11px">${new Date(n.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span><button class="btn sm ghost" onclick="showView('explore');select('${n.id}',true)">Raise</button></span></div>`).join('')}<div style="padding:8px 0"><button class="btn sm ghost" onclick="store.notifs.forEach(n=>n.read=true);save();renderOffers()">Mark all read</button></div></div>`:''}

}

/* ---- rank view: leaderboards + deal feed ---- */
function renderRank(){
  const people=[...DB.people].sort((a,b)=>b.points-a.points);
  const gained=p=>((p.deals12m*7+p.name.length*3)%40)+(p.tier==='attested'?10:0)+(Object.values(store.offers).flat().filter(o=>o.bidderId===p.id).length*2);
  const climbing=[...DB.people].sort((a,b)=>gained(b)-gained(a)).slice(0,6);
  const cc=countryCounts();const countries=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const brokers=DB.people.filter(p=>p.type==='broker').sort((a,b)=>b.deals12m-a.deals12m).slice(0,5);
  const feed=[...Object.entries(store.offers).flatMap(([id,arr])=>arr.map(o=>({kind:'offer',domain:byId[id].name,price:o.amount,who:o.bidderId===ME?'You':byId[o.bidderId]?.label,country:byId[o.bidderId]?.country,at:o.at}))),...DB.deals.map(x=>({...x,who:x.buyer}))].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,12);
  $('#rankMain').innerHTML=`<div class="kicker">Reputation</div><h2>Leaderboards</h2><p class="lead-sub">Points come from verification tier, listings, offers, attested deals and activity. They change pin size, sort rank and badges — never match scores, and they can't be bought.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px">
    <div><h4 class="kicker" style="margin:0 0 6px">Top members</h4>${people.slice(0,10).map((p,i)=>`<div class="lead-row"><span class="r">${i+1}</span><button class="lnk" style="border:0;padding:0;text-align:left;color:var(--text)" onclick="showView('explore');select('${p.id}',true)"><span style="font-family:var(--heading);font-size:17px;font-weight:600">${esc(p.name)}</span> <span class="muted" style="font-size:12px">${esc(p.city)}</span><div style="display:flex;gap:6px;margin-top:2px">${tierChip(p)}<span class="muted" style="font-size:11px">${p.type}</span></div></button><span class="pts">${p.points}</span></div>`).join('')}</div>
    <div><h4 class="kicker" style="margin:0 0 6px">Top countries</h4>${countries.map(([c,n],i)=>`<div class="lead-row"><span class="r">${i+1}</span><button class="lnk" style="border:0;padding:0;text-align:left;color:var(--text)" onclick="showView('explore');map.flyTo(countryCenter('${c}'),5)"><span style="font-family:var(--heading);font-size:17px;font-weight:600">${COUNTRY[c]}</span><div class="muted" style="font-size:11px">${DB.people.filter(p=>p.country===c).reduce((a,p)=>a+p.points,0)} pts combined</div></button><span class="pts">${n}</span></div>`).join('')}
      <h4 class="kicker" style="margin:22px 0 6px">Most active brokers</h4>${brokers.map((p,i)=>`<div class="lead-row"><span class="r">${i+1}</span><button class="lnk" style="border:0;padding:0;text-align:left;color:var(--text)" onclick="showView('explore');select('${p.id}',true)"><span style="font-family:var(--heading);font-size:17px;font-weight:600">${esc(p.name)}</span> <span class="muted" style="font-size:12px">${esc(p.org||p.city)}</span></button><span class="pts" style="font-size:16px">${p.deals12m} deals</span></div>`).join('')}</div>
    <div><h4 class="kicker" style="margin:0 0 6px">Climbing today <span class="muted" style="letter-spacing:0;text-transform:none;font-size:11px">· points since midnight (sample)</span></h4>${climbing.map(p=>`<div class="lead-row" style="grid-template-columns:34px 1fr auto"><span class="apin" style="width:34px;height:34px;box-shadow:none">${avatarHTML(p)}</span><button class="lnk" style="border:0;padding:0;text-align:left;color:var(--text)" onclick="showView('explore');select('${p.id}',true)"><span style="font-family:var(--heading);font-size:17px;font-weight:600">${esc(p.name)}</span><div class="muted" style="font-size:11px">${esc(p.city)}${p.xHandle?' · @'+esc(p.xHandle):''}</div></button><span style="text-align:right"><span class="gain" style="font-family:var(--heading);font-size:18px">▲ ${gained(p)}</span><div class="muted" style="font-size:11px">#${p.rank}</div></span></div>`).join('')}
      <h4 class="kicker" style="margin:22px 0 6px">Deal feed</h4>${feed.map(f=>`<div class="lead-row" style="grid-template-columns:1fr auto"><span><span class="mono" style="font-size:13px">${esc(f.domain)}</span> <span class="muted" style="font-size:12px">${f.kind==='sale'?'sold to':'offer by'} ${esc(f.who||'undisclosed')}${f.country?' · '+f.country:''}</span><div class="muted" style="font-size:11px">${f.at.slice(0,10)}</div></span><span class="mono" style="color:${f.kind==='sale'?'var(--accent-hi)':'var(--text)'}">${money(f.price)}</span></div>`).join('')}</div>
  </div>`;
}

/* ---- leads view ---- */
function renderLeads(){
  $('#leadCount').textContent=store.leads.length;
  const L=store.leads;
  $('#leadsMain').innerHTML=`<div class="kicker">Lead CRM</div><h2>Pipeline</h2><p class="lead-sub">Companies and people you've flagged, with the domain you'd pitch. Stored locally in this prototype; production persists per workspace.</p>
  ${L.length?`<table><thead><tr><th>Lead</th><th>Domain</th><th>Stage</th><th>Note</th><th>Added</th><th></th></tr></thead><tbody>${L.map(l=>{const t=byId[l.targetId],d=l.domainId?byId[l.domainId]:null;return `<tr><td><span class="t">${esc(t.label)}</span><div class="muted" style="font-size:11px">${t.kind} · ${esc(t.loc)}</div></td><td class="mono" style="font-size:13px">${d?esc(d.name):'<span class="muted">—</span>'}</td><td><select class="stage" onchange="setStage('${l.id}',this.value)">${STAGES.map(s=>`<option ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select></td><td style="min-width:200px"><input class="note" placeholder="Add a note…" value="${esc(l.note)}" onchange="setNote('${l.id}',this.value)"></td><td class="muted num" style="font-size:12px">${l.added}</td><td style="white-space:nowrap"><button class="btn sm ghost" onclick="showView('explore');select('${t.id}',true)">Map</button> <button class="btn sm ghost" onclick="removeLead('${l.id}')" style="color:var(--muted)">Remove</button></td></tr>`;}).join('')}</tbody></table>`
  :`<div class="empty">No leads yet. Open a domain on the map and add its likely buyers.</div>`}`;
}
function setStage(id,v){const l=store.leads.find(x=>x.id===id);l.stage=v;save();}
function setNote(id,v){const l=store.leads.find(x=>x.id===id);l.note=v;save();}
function removeLead(id){store.leads=store.leads.filter(x=>x.id!==id);save();renderLeads();}
</script>
